name: Validate AI OS

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Structure, links, frontmatter, secrets
        run: python3 scripts/validate.py
      - name: Guard hook tests
        run: python3 -m unittest discover -s tests -v
